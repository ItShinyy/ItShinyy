<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trái Tim 3D & 2D - Chúc Mừng Hải Yến 20.10</title>
  <style>
    html, body {
      height: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
      background: #000; /* Unified dark background */
      font-family: Arial, sans-serif;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #pinkboard {
      opacity: 0.7; /* Slight transparency to blend with 3D animation */
      pointer-events: none; /* Prevent 2D canvas from blocking interactions */
    }
    #error {
      color: #ff69b4;
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="error"></div>
  <canvas id="pinkboard"></canvas>

  <!-- CDN links for Three.js and TWEEN.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/25.0.0/tween.umd.js"></script>

  <!-- 3D Animation Script -->
  <script>
    // Global variables for 3D animation
    let scene, camera, renderer, clock, heartParticles, outerRing, innerRing;

    // Error logging
    function logError(message) {
      const errorDiv = document.getElementById('error');
      errorDiv.innerHTML += `<p>${message}</p>`;
      console.error(message);
    }

    // WebGL support check
    function isWebGLAvailable() {
      try {
        const canvas = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
      } catch (e) {
        return false;
      }
    }

    // Initialize 3D animation
    window.addEventListener('load', () => {
      if (typeof THREE === 'undefined') {
        logError('Three.js failed to load from CDN. Check your internet connection or try refreshing.');
        return;
      }
      if (typeof TWEEN === 'undefined') {
        logError('TWEEN.js failed to load from CDN. Check your internet connection or try refreshing.');
        return;
      }
      if (isWebGLAvailable()) {
        init3D();
      } else {
        logError('WebGL is not supported in this browser.');
      }
    });

    function init3D() {
      try {
        // Scene + Camera
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 120);

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0); // Transparent background
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap for performance
        document.body.appendChild(renderer.domElement);

        // Clock
        clock = new THREE.Clock();

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        const pointLight1 = new THREE.PointLight(0xff66cc, 1.5, 500);
        pointLight1.position.set(0, 50, 150);
        const pointLight2 = new THREE.PointLight(0x6600ff, 1.0, 500);
        pointLight2.position.set(0, -50, -150);
        scene.add(ambientLight, pointLight1, pointLight2);

        // Objects
        createHeartParticles();
        createSpinningText();

        // Events
        window.addEventListener('resize', onResize3D);

        // Start animation
        startHeartAnimation();
        animate3D();
      } catch (e) {
        logError(`3D Initialization error: ${e.message}`);
      }
    }

    // Text content
    const outerText = ["Chúc em Yến sinh nhật vui vẻ!"  , "Tuối mới học tốt điểm cao", "Ngập tràn niềm vui", "Thật hạnh phúc", "Luôn  luôn ngoan xinh yêu", "♥"];   
    const innerText = ["Chúc em", "luôn là", "cô gái", "may mắn", "nhất thế gian"];

    // Create heart particles
    function createHeartParticles() {
      try {
        const particleCount = 5000; // Reduced for performance
        const positions = new Float32Array(particleCount * 3);
        const startPositions = new Float32Array(particleCount * 3);
        const endPositions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
          const i3 = i * 3;
          const t = Math.random() * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(t), 3);
          const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
          const z = (Math.random() - 0.5) * 8;
          endPositions[i3] = x * 1.8;
          endPositions[i3 + 1] = y * 1.8;
          endPositions[i3 + 2] = z * 1.8;
          const r = 150;
          const phi = Math.random() * Math.PI * 2;
          const theta = Math.random() * Math.PI;
          startPositions[i3] = r * Math.sin(theta) * Math.cos(phi);
          startPositions[i3 + 1] = r * Math.sin(theta) * Math.sin(phi);
          startPositions[i3 + 2] = r * Math.cos(theta);
          positions[i3] = startPositions[i3];
          positions[i3 + 1] = startPositions[i3 + 1];
          positions[i3 + 2] = startPositions[i3 + 2];
          const color = new THREE.Color().setHSL(0.8 - (y + 20) / 40 * 0.3, 0.8, 0.6);
          colors[i3] = color.r;
          colors[i3 + 1] = color.g;
          colors[i3 + 2] = color.b;
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geom.setAttribute('start', new THREE.BufferAttribute(startPositions, 3));
        geom.setAttribute('end', new THREE.BufferAttribute(endPositions, 3));
        geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const mat = new THREE.PointsMaterial({
          size: 0.5,
          sizeAttenuation: true,
          vertexColors: true,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending
        });

        heartParticles = new THREE.Points(geom, mat);
        heartParticles.position.y = 20;
        scene.add(heartParticles);
      } catch (e) {
        logError(`Heart particles error: ${e.message}`);
      }
    }

    // Create sprite text with glow
    function createTextSprite(text, color, fontSize) {
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const scale = 2;
        canvas.width = 2048 * scale; // Higher resolution
        canvas.height = 512 * scale;
        ctx.scale(scale, scale);
        ctx.font = `bold ${fontSize}px Arial, sans-serif`;
        ctx.fillStyle = color;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.shadowColor = color;
        ctx.shadowBlur = 20;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, canvas.width / (2 * scale), canvas.height / (2 * scale));
        ctx.strokeText(text, canvas.width / (2 * scale), canvas.height / (2 * scale));

        const tex = new THREE.CanvasTexture(canvas);
        tex.needsUpdate = true;
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, alphaTest: 0.2 });
        const spr = new THREE.Sprite(mat);
        spr.scale.set((canvas.width / scale) * 0.08, (canvas.height / scale) * 0.08, 1);
        return spr;
      } catch (e) {
        logError(`Text sprite error: ${e.message}`);
        return new THREE.Sprite();
      }
    }

    function createSpinningText() {
      try {
        outerRing = new THREE.Group();
        innerRing = new THREE.Group();
        const outerR = 50;
        const innerR = 40;

        outerText.forEach((t, i) => {
          const s = createTextSprite(t, '#ffffff', 70);
          const a = (i / outerText.length) * Math.PI * 2;
          s.position.set(Math.cos(a) * outerR, -12, Math.sin(a) * outerR);
          outerRing.add(s);
        });

        innerText.forEach((t, i) => {
          const s = createTextSprite(t, '#e0e0e0', 60);
          const a = (i / innerText.length) * Math.PI * 2;
          s.position.set(Math.cos(a) * innerR, -12, Math.sin(a) * innerR);
          innerRing.add(s);
        });

        scene.add(outerRing, innerRing);
      } catch (e) {
        logError(`Spinning text error: ${e.message}`);
      }
    }

    // Heart entrance animation
    function startHeartAnimation() {
      try {
        const geom = heartParticles.geometry;
        const pos = geom.getAttribute('position');
        const start = geom.getAttribute('start');
        const end = geom.getAttribute('end');

        const progress = { v: 0 };
        new TWEEN.Tween(progress)
          .to({ v: 1 }, 4000)
          .easing(TWEEN.Easing.Cubic.InOut)
          .onUpdate(() => {
            const cnt = pos.count;
            for (let i = 0; i < cnt; i++) {
              const i3 = i * 3;
              pos.array[i3] = start.array[i3] + (end.array[i3] - start.array[i3]) * progress.v;
              pos.array[i3 + 1] = start.array[i3 + 1] + (end.array[i3 + 1] - start.array[i3 + 1]) * progress.v;
              pos.array[i3 + 2] = start.array[i3 + 2] + (end.array[i3 + 2] - start.array[i3 + 2]) * progress.v;
            }
            pos.needsUpdate = true;
          })
          .repeat(Infinity)
          .yoyo(true)
          .start();
      } catch (e) {
        logError(`Heart animation error: ${e.message}`);
      }
    }

    // Resize handler for 3D
    function onResize3D() {
      try {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      } catch (e) {
        logError(`3D Resize error: ${e.message}`);
      }
    }

    // 3D Animation loop
    function animate3D() {
      try {
        requestAnimationFrame(animate3D);
        TWEEN.update();
        const t = clock.getElapsedTime();

        if (heartParticles) {
          const s = 1 + Math.sin(t * 2.5) * 0.05;
          heartParticles.scale.set(s, s, s);
        }

        if (heartParticles) heartParticles.rotation.y += 0.004;
        if (outerRing) outerRing.rotation.y += 0.005;
        if (innerRing) innerRing.rotation.y -= 0.003;

        renderer.render(scene, camera);
      } catch (e) {
        logError(`3D Animation error: ${e.message}`);
      }
    }
  </script>

  <!-- 2D Particle Animation Script -->
  <script>
    var settings = {
      particles: {
        length: 300, // Reduced for performance
        duration: 2,
        velocity: 50,
        effect: -0.75,
        size: 20, // Smaller particles
      },
    };

    // RequestAnimationFrame polyfill
    (function(){var b=0;var c=["ms","moz","webkit","o"];for(var a=0;a<c.length&&!window.requestAnimationFrame;++a){window.requestAnimationFrame=window[c[a]+"RequestAnimationFrame"];window.cancelAnimationFrame=window[c[a]+"CancelAnimationFrame"]||window[c[a]+"CancelRequestAnimationFrame"]}if(!window.requestAnimationFrame){window.requestAnimationFrame=function(h,e){var d=new Date().getTime();var f=Math.max(0,16-(d-b));var g=window.setTimeout(function(){h(d+f)},f);b=d+f;return g}}if(!window.cancelAnimationFrame){window.cancelAnimationFrame=function(d){clearTimeout(d)}}}());

    // Point class
    var Point = (function() {
      function Point(x, y) {
        this.x = (typeof x !== 'undefined') ? x : 0;
        this.y = (typeof y !== 'undefined') ? y : 0;
      }
      Point.prototype.clone = function() {
        return new Point(this.x, this.y);
      };
      Point.prototype.length = function(length) {
        if (typeof length == 'undefined')
          return Math.sqrt(this.x * this.x + this.y * this.y);
        this.normalize();
        this.x *= length;
        this.y *= length;
        return this;
      };
      Point.prototype.normalize = function() {
        var length = this.length();
        this.x /= length;
        this.y /= length;
        return this;
      };
      return Point;
    })();

    // Particle class
    var Particle = (function() {
      function Particle() {
        this.position = new Point();
        this.velocity = new Point();
        this.acceleration = new Point();
        this.age = 0;
      }
      Particle.prototype.initialize = function(x, y, dx, dy) {
        this.position.x = x;
        this.position.y = y;
        this.velocity.x = dx;
        this.velocity.y = dy;
        this.acceleration.x = dx * settings.particles.effect;
        this.acceleration.y = dy * settings.particles.effect;
        this.age = 0;
      };
      Particle.prototype.update = function(deltaTime) {
        this.position.x += this.velocity.x * deltaTime;
        this.position.y += this.velocity.y * deltaTime;
        this.velocity.x += this.acceleration.x * deltaTime;
        this.velocity.y += this.acceleration.y * deltaTime;
        this.age += deltaTime;
      };
      Particle.prototype.draw = function(context, image) {
        function ease(t) {
          return (--t) * t * t + 1;
        }
        var size = image.width * ease(this.age / settings.particles.duration);
        context.globalAlpha = 1 - this.age / settings.particles.duration;
        context.drawImage(image, this.position.x - size / 2, this.position.y - size / 2, size, size);
      };
      return Particle;
    })();

    // ParticlePool class
    var ParticlePool = (function() {
      var particles,
          firstActive = 0,
          firstFree = 0,
          duration = settings.particles.duration;
      function ParticlePool(length) {
        particles = new Array(length);
        for (var i = 0; i < particles.length; i++)
          particles[i] = new Particle();
      }
      ParticlePool.prototype.add = function(x, y, dx, dy) {
        particles[firstFree].initialize(x, y, dx, dy);
        firstFree++;
        if (firstFree == particles.length) firstFree = 0;
        if (firstActive == firstFree) firstActive++;
        if (firstActive == particles.length) firstActive = 0;
      };
      ParticlePool.prototype.update = function(deltaTime) {
        var i;
        if (firstActive < firstFree) {
          for (i = firstActive; i < firstFree; i++)
            particles[i].update(deltaTime);
        }
        if (firstFree < firstActive) {
          for (i = firstActive; i < particles.length; i++)
            particles[i].update(deltaTime);
          for (i = 0; i < firstFree; i++)
            particles[i].update(deltaTime);
        }
        while (particles[firstActive].age >= duration && firstActive != firstFree) {
          firstActive++;
          if (firstActive == particles.length) firstActive = 0;
        }
      };
      ParticlePool.prototype.draw = function(context, image) {
        if (firstActive < firstFree) {
          for (i = firstActive; i < firstFree; i++)
            particles[i].draw(context, image);
        }
        if (firstFree < firstActive) {
          for (i = firstActive; i < particles.length; i++)
            particles[i].draw(context, image);
          for (i = 0; i < firstFree; i++)
            particles[i].draw(context, image);
        }
      };
      return ParticlePool;
    })();

    // Main 2D animation
    (function(canvas) {
      var context = canvas.getContext('2d'),
          particles = new ParticlePool(settings.particles.length),
          particleRate = settings.particles.length / settings.particles.duration,
          time;
      function pointOnHeart(t) {
        return new Point(
          160 * Math.pow(Math.sin(t), 3),
          130 * Math.cos(t) - 50 * Math.cos(2 * t) - 20 * Math.cos(3 * t) - 10 * Math.cos(4 * t) + 25
        );
      }
      var image = (function() {
        var canvas = document.createElement('canvas'),
            context = canvas.getContext('2d');
        canvas.width = settings.particles.size;
        canvas.height = settings.particles.size;
        function to(t) {
          var point = pointOnHeart(t);
          point.x = settings.particles.size / 2 + point.x * settings.particles.size / 350;
          point.y = settings.particles.size / 2 - point.y * settings.particles.size / 350;
          return point;
        }
        context.beginPath();
        var t = -Math.PI;
        var point = to(t);
        context.moveTo(point.x, point.y);
        while (t < Math.PI) {
          t += 0.01;
          point = to(t);
          context.lineTo(point.x, point.y);
        }
        context.closePath();
        context.fillStyle = '#ea80b0';
        context.fill();
        var image = new Image();
        image.src = canvas.toDataURL();
        return image;
      })();
      function render2D() {
        requestAnimationFrame(render2D);
        var newTime = new Date().getTime() / 1000,
            deltaTime = newTime - (time || newTime);
        time = newTime;
        context.clearRect(0, 0, canvas.width, canvas.height);
        var amount = particleRate * deltaTime;
        for (var i = 0; i < amount; i++) {
          var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
          var dir = pos.clone().length(settings.particles.velocity);
          particles.add(canvas.width / 2 + pos.x, canvas.height / 2 - pos.y, dir.x, -dir.y);
        }
        particles.update(deltaTime);
        particles.draw(context, image);
      }
      function onResize2D() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
      }
      window.addEventListener('resize', onResize2D);
      setTimeout(function() {
        onResize2D();
        render2D();
      }, 10);
    })(document.getElementById('pinkboard'));
  </script>
</body>
</html>
