<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trái Tim 3D - Hải Yến</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #error { color: red; font-family: Arial, sans-serif; position: absolute; top: 10px; left: 10px; }
  </style>
</head>
<body>
  <div id="error"></div>
  <!-- Local library scripts -->
  <script src="Libs/three.cjs"></script>
  <script src="Libs/tween.min.js"></script>
  <script>
    // Declare global variables
    let scene, camera, renderer, clock, heartParticles, outerRing, innerRing;

    // Error logging
    function logError(message) {
      const errorDiv = document.getElementById('error');
      errorDiv.innerHTML += `<p>${message}</p>`;
      console.error(message);
    }

    // WebGL support check
    function isWebGLAvailable() {
      try {
        const canvas = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
      } catch (e) {
        return false;
      }
    }

    // Check libraries and initialize
    window.addEventListener('load', () => {
      if (typeof THREE === 'undefined') {
        logError('Three.js failed to load from Libs/three.core.min.js. Check file path or library availability.');
        return;
      }
      if (typeof TWEEN === 'undefined') {
        logError('TWEEN.js failed to load from Libs/tween.min.js. Check file path or library availability.');
        return;
      }
      if (isWebGLAvailable()) {
        init();
      } else {
        logError('WebGL is not supported in this browser.');
      }
    });

    function init() {
      try {
        // Scene + Camera
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 60;

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000);
        document.body.appendChild(renderer.domElement);

        // Clock
        clock = new THREE.Clock();

        // Lights
        const p1 = new THREE.PointLight(0xff66cc, 1.2, 300);
        p1.position.set(0, 25, 80);
        const p2 = new THREE.PointLight(0x6600ff, 0.6, 300);
        p2.position.set(0, -25, -80);
        scene.add(p1, p2);

        // Fallback cube
        const cubeGeometry = new THREE.BoxGeometry(10, 10, 10);
        const cubeMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        scene.add(cube);

        // Objects
        createHeartParticles();
        createSpinningText();

        // Events
        window.addEventListener('resize', onResize);

        // Start animation
        startHeartAnimation();
        animate();
      } catch (e) {
        logError(`Initialization error: ${e.message}`);
      }
    }

    // Text content
    const outerText = ["Chúc Hải Yến ngày 20.10", "Ngập tràn niềm vui", "Thật hạnh phúc", "Luôn xinh đẹp", "♥"];
    const innerText = ["Chúc em", "luôn là", "cô gái", "may mắn", "nhất thế gian"];

    // Create heart particles
    function createHeartParticles() {
      try {
        const particleCount = 5000;
        const positions = new Float32Array(particleCount * 3);
        const startPositions = new Float32Array(particleCount * 3);
        const endPositions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
          const i3 = i * 3;
          const t = Math.random() * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(t), 3);
          const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
          const z = (Math.random() - 0.5) * 4;
          endPositions[i3] = x * 0.9;
          endPositions[i3 + 1] = y * 0.9;
          endPositions[i3 + 2] = z * 0.9;
          const r = 80;
          const phi = Math.random() * Math.PI * 2;
          const theta = Math.random() * Math.PI;
          startPositions[i3] = r * Math.sin(theta) * Math.cos(phi);
          startPositions[i3 + 1] = r * Math.sin(theta) * Math.sin(phi);
          startPositions[i3 + 2] = r * Math.cos(theta);
          positions[i3] = startPositions[i3];
          positions[i3 + 1] = startPositions[i3 + 1];
          positions[i3 + 2] = startPositions[i3 + 2];
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geom.setAttribute('start', new THREE.BufferAttribute(startPositions, 3));
        geom.setAttribute('end', new THREE.BufferAttribute(endPositions, 3));

        const mat = new THREE.PointsMaterial({
          color: 0xff66cc,
          size: 0.3,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending
        });

        heartParticles = new THREE.Points(geom, mat);
        heartParticles.position.y = 12;
        scene.add(heartParticles);
      } catch (e) {
        logError(`Heart particles error: ${e.message}`);
      }
    }

    // Create sprite text
    function createTextSprite(text, color, fontSize) {
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const scale = 2;
        canvas.width = 512 * scale;
        canvas.height = 128 * scale;
        ctx.scale(scale, scale);
        ctx.font = `${fontSize}px Arial, sans-serif`;
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, canvas.width / (2 * scale), canvas.height / (2 * scale));

        const tex = new THREE.CanvasTexture(canvas);
        tex.needsUpdate = true;
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
        const spr = new THREE.Sprite(mat);
        spr.scale.set((canvas.width / scale) * 0.05, (canvas.height / scale) * 0.05, 1);
        return spr;
      } catch (e) {
        logError(`Text sprite error: ${e.message}`);
        return new THREE.Sprite();
      }
    }

    function createSpinningText() {
      try {
        outerRing = new THREE.Group();
        innerRing = new THREE.Group();
        const outerR = 34;
        const innerR = 26;

        outerText.forEach((t, i) => {
          const s = createTextSprite(t, '#ffffff', 52);
          const a = (i / outerText.length) * Math.PI * 2;
          s.position.set(Math.cos(a) * outerR, -10, Math.sin(a) * outerR);
          outerRing.add(s);
        });

        innerText.forEach((t, i) => {
          const s = createTextSprite(t, '#bbbbbb', 44);
          const a = (i / innerText.length) * Math.PI * 2;
          s.position.set(Math.cos(a) * innerR, -10, Math.sin(a) * innerR);
          innerRing.add(s);
        });

        scene.add(outerRing, innerRing);
      } catch (e) {
        logError(`Spinning text error: ${e.message}`);
      }
    }

    // Heart entrance tween
    function startHeartAnimation() {
      try {
        const geom = heartParticles.geometry;
        const pos = geom.getAttribute('position');
        const start = geom.getAttribute('start');
        const end = geom.getAttribute('end');

        const progress = { v: 0 };
        new TWEEN.Tween(progress)
          .to({ v: 1 }, 3800)
          .easing(TWEEN.Easing.Cubic.InOut)
          .onUpdate(() => {
            const cnt = pos.count;
            for (let i = 0; i < cnt; i++) {
              const i3 = i * 3;
              pos.array[i3] = start.array[i3] + (end.array[i3] - start.array[i3]) * progress.v;
              pos.array[i3 + 1] = start.array[i3 + 1] + (end.array[i3 + 1] - start.array[i3 + 1]) * progress.v;
              pos.array[i3 + 2] = start.array[i3 + 2] + (end.array[i3 + 2] - start.array[i3 + 2]) * progress.v;
            }
            pos.needsUpdate = true;
          })
          .start();
      } catch (e) {
        logError(`Heart animation error: ${e.message}`);
      }
    }

    // Resize handler
    function onResize() {
      try {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      } catch (e) {
        logError(`Resize error: ${e.message}`);
      }
    }

    // Render loop
    function animate() {
      try {
        requestAnimationFrame(animate);
        TWEEN.update();
        const t = clock.getElapsedTime();

        // Subtle heartbeat (scale)
        const s = 1 + Math.sin(t * 3) * 0.035;
        heartParticles.scale.set(s, s, s);

        // Rotation
        heartParticles.rotation.y += 0.0035;
        if (outerRing) outerRing.rotation.y += 0.004;
        if (innerRing) innerRing.rotation.y -= 0.002;

        renderer.render(scene, camera);
      } catch (e) {
        logError(`Animation error: ${e.message}`);
      }
    }
  </script>
</body>
</html>
